name: Node CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify selected runtime
        run: |
          node -e "const fs = require('node:fs'); if (process.versions.node !== fs.readFileSync('.nvmrc', 'utf8').trim()) throw new Error('Node pin mismatch')"
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci --registry=https://npm.flatt.tech/ --no-audit --no-fund
      - name: Run tests
        run: npm test
